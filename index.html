<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Offline-first active recall & spaced repetition study app." />
    <title>Recall — Study & Spaced Repetition</title>
    <!--
      GitHub Pages has no server-side rewrites, so a deep link (e.g. /study)
      404s on a hard refresh. 404.html redirects here with the original path
      encoded in the query string; this restores it via history.replaceState
      before the router mounts. No-op on any host that doesn't 404 this way.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
